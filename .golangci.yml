version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - godot
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      # The project is written in Australian/British English.
      locale: UK
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
